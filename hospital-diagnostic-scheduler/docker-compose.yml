services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hds_dev_password}
      POSTGRES_DB: hds
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hds"]
      interval: 5s
      retries: 10
  redis:            # optional: only needed when running more than one API worker
    image: redis:7-alpine
  api:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://hds:${POSTGRES_PASSWORD:-hds_dev_password}@db:5432/hds
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  pgdata:
